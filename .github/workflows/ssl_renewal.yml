name: Auto Vercel SSL Renewal & Verification

on:
  schedule:
    # 홀수달 2일 새벽 3시마다 실행 (약 60일 주기)
    - cron: '0 18 1 1,3,5,7,9,11 *'
  workflow_dispatch: # 수동 테스트 버튼

jobs:
  ssl-renewal-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 유머인 DNS 레코드 ID 가져오기
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          API_URL="https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records"
          AUTH_HEADER="Authorization: Bearer ${CF_API_TOKEN}"
          RECORDS=$(curl -s -X GET "$API_URL" -H "$AUTH_HEADER" -H "Content-Type: application/json")
          echo "ID_ROOT=$(echo $RECORDS | jq -r '.result[] | select(.name=="humorin.kr") | .id')" >> $GITHUB_ENV
          echo "ID_WWW=$(echo $RECORDS | jq -r '.result[] | select(.name=="www.humorin.kr") | .id')" >> $GITHUB_ENV

      - name: 2. 방화벽 임시 해제 (회색 구름으로 변경)
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          API_URL="https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records"
          AUTH_HEADER="Authorization: Bearer ${CF_API_TOKEN}"
          curl -s -X PATCH "$API_URL/${{ env.ID_ROOT }}" -H "$AUTH_HEADER" -H "Content-Type: application/json" -d '{"proxied": false}'
          curl -s -X PATCH "$API_URL/${{ env.ID_WWW }}" -H "$AUTH_HEADER" -H "Content-Type: application/json" -d '{"proxied": false}'
          echo "방화벽 해제 완료. Vercel 갱신을 위해 30분 대기합니다..."

      - name: 3. Vercel 인증서 갱신 대기 (30분)
        run: sleep 1800

      - name: 4. [비상 복구 보장] 방화벽 완벽 복구 (주황색 구름으로 변경)
        if: always() # 🚨 핵심 방어 로직: 앞 단계에서 취소/에러가 나도 무조건 실행됨
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          API_URL="https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records"
          AUTH_HEADER="Authorization: Bearer ${CF_API_TOKEN}"
          curl -s -X PATCH "$API_URL/${{ env.ID_ROOT }}" -H "$AUTH_HEADER" -H "Content-Type: application/json" -d '{"proxied": true}'
          curl -s -X PATCH "$API_URL/${{ env.ID_WWW }}" -H "$AUTH_HEADER" -H "Content-Type: application/json" -d '{"proxied": true}'
          echo "방화벽 원상 복구 완료. 1분 후 크로스체크를 시작합니다."
          sleep 60

      - name: 5. [크로스체크] SSL 인증서 갱신 상태 딥 체크
        if: always()
        run: |
          echo "유머인(humorin.kr) 실제 보안 인증서 유효기간 추출 중..."
          
          # 인증서 만료일 강제 추출
          EXP_DATE=$(echo | openssl s_client -servername humorin.kr -connect humorin.kr:443 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          
          # 날짜 계산 (남은 일수)
          EXP_SECONDS=$(date -d "$EXP_DATE" +%s)
          NOW_SECONDS=$(date +%s)
          REMAINING_DAYS=$(( ($EXP_SECONDS - $NOW_SECONDS) / 86400 ))
          
          echo "================================================="
          echo "✅ 추출된 SSL 만료일: $EXP_DATE"
          echo "✅ 현재 남은 유효 기간: $REMAINING_DAYS 일"
          echo "================================================="
          
          if [ "$REMAINING_DAYS" -lt 20 ]; then
            echo "🚨 [비상 사태] 인증서가 정상 갱신되지 않았습니다! 남은 기간이 20일 미만입니다."
            echo "🚨 GitHub이 이메일 경고를 발송하도록 스크립트를 강제 종료합니다."
            exit 1
          else
            echo "🎉 [안전] 인증서가 넉넉하게 남아있으며 갱신이 성공적으로 검증되었습니다!"
          fi